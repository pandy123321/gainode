# Auth / Session 业务 schema（05 §2.1 / §3 AuthSession）
# 写操作最少返回字段见 common.yaml#/WriteResult；这里补充业务 request/response。

RegisterRequest:
  type: object
  required: [account, account_type, consent_version]
  properties:
    account: { type: string, maxLength: 128 }
    account_type: { type: string, enum: [email, mobile] }
    password: { type: string, minLength: 8, maxLength: 128 }
    vcode: { type: string, description: OTP 验证码（V1.x 短信/邮箱验证码） }
    invite_code: { type: string, nullable: true }
    nickname: { type: string, nullable: true }
    locale: { type: string, default: zh-CN }
    timezone: { type: string, nullable: true }
    consent_version: { type: string, description: 当前隐私/条款 consent 版本 }
  additionalProperties: false

LoginRequest:
  type: object
  required: [account, password]
  properties:
    account: { type: string, maxLength: 128 }
    password: { type: string, maxLength: 128 }
  additionalProperties: false

OtpVerifyRequest:
  type: object
  required: [account, vcode]
  properties:
    account: { type: string, maxLength: 128 }
    vcode: { type: string }
    type: { type: string, enum: [email, mobile], default: email }
    source: { type: string, enum: [login, register, forget, code], default: login }
  additionalProperties: false

OtpResendRequest:
  type: object
  required: [account]
  properties:
    account: { type: string, maxLength: 128 }
    type: { type: string, enum: [email, mobile], default: email }
    source: { type: string, enum: [login, register, forget, code], default: login }
  additionalProperties: false

MfaVerifyRequest:
  type: object
  required: [code]
  properties:
    code: { type: string, description: TOTP 一次性验证码 }
    session_id: { type: string, nullable: true, description: mfa_required 会话续验时携带 }
  additionalProperties: false

RefreshRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token: { type: string }
  additionalProperties: false

RecoveryRequest:
  type: object
  required: [account]
  properties:
    account: { type: string, maxLength: 128 }
  additionalProperties: false

PasswordResetRequest:
  type: object
  required: [account, vcode, password]
  properties:
    account: { type: string, maxLength: 128 }
    vcode: { type: string }
    password: { type: string, minLength: 8, maxLength: 128 }
  additionalProperties: false

AuthTokenResponse:
  description: 登录/刷新成功返回的凭证（不泄露 refresh_token 明文之外的敏感字段）
  type: object
  required: [token_type, access_token, expires_in, session_id, mfa_required]
  properties:
    token_type: { type: string, default: Bearer }
    access_token: { type: string }
    expires_in: { type: integer }
    session_id: { type: string }
    mfa_required: { type: boolean }
    mfa_enrollment: { $ref: './user.yaml#/MfaEnrollment' }

SessionListResponse:
  type: object
  required: [sessions]
  properties:
    sessions:
      type: array
      items: { $ref: './user.yaml#/SessionDevice' }

MfaEnrollmentSetupRequest:
  type: object
  required: [method_type]
  properties:
    method_type: { type: string, enum: [totp] }
  additionalProperties: false

MfaEnrollmentSetupResponse:
  type: object
  required: [enrollment_id, method_type, secret, otpauth_url, expires_in]
  properties:
    enrollment_id: { type: string }
    method_type: { type: string }
    secret: { type: string, description: 一次性 TOTP secret，仅此响应返回，之后不回显 }
    otpauth_url: { type: string }
    expires_in: { type: integer }

MfaEnrollmentConfirmRequest:
  type: object
  required: [enrollment_id, code]
  properties:
    enrollment_id: { type: string }
    code: { type: string }
  additionalProperties: false
