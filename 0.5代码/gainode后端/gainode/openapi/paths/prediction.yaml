# Prediction P0 路径骨架（05 §6 Prediction，C 端）
# S02-P05：8 对象状态机骨架 + fail-closed + 只读投影落地。
#   - consent_receipt_create：完整实现（grant 幂等去重）。
#   - order_create / order_addition：依赖锁盘参数/资格/stake（06 TBC）→ 503 fail-closed。
#   - appeal_create：依赖 RiskCase/案件契约（未冻结）→ 503 fail-closed。

markets:
  get:
    operationId: prediction_markets
    summary: 市场列表
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

market_detail:
  get:
    operationId: prediction_market_detail
    summary: 市场详情
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses/common.yaml#/NotFound' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

market_disclosure:
  get:
    operationId: prediction_market_disclosure
    summary: 市场披露（版本化 disclosure）
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

consent_receipt_create:
  post:
    operationId: prediction_consent_receipt_create
    summary: 创建同意回执
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '409': { $ref: '../components/responses/common.yaml#/Conflict' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

order_create:
  get:
    operationId: prediction_order_list
    summary: 我的预测订单列表（lint 补齐：种子已注册只读端点 myOrders）
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }
  post:
    operationId: prediction_order_create
    summary: 提交订单（锁盘参数/资格/stake TBC → fail-closed）
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
      - $ref: '../components/headers/request.yaml#/If-Match'
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '202': { $ref: '../components/responses/common.yaml#/ResultUnknown' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '409': { $ref: '../components/responses/common.yaml#/Conflict' }
      '422': { $ref: '../components/responses/common.yaml#/Unprocessable' }
      '503': { $ref: '../components/responses/common.yaml#/DependencyUnavailable' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

order_addition:
  post:
    operationId: prediction_order_addition
    summary: 同选项追加（锁盘参数/资格/stake TBC → fail-closed）
    tags: [Prediction]
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
      - $ref: '../components/headers/request.yaml#/If-Match'
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '409': { $ref: '../components/responses/common.yaml#/Conflict' }
      '422': { $ref: '../components/responses/common.yaml#/Unprocessable' }
      '503': { $ref: '../components/responses/common.yaml#/DependencyUnavailable' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

