# Auth / Session P0 路径（05 §2.1）— S02-P02 落地业务 request/response schema。
# 写操作统一 Idempotency-Key；统一响应见 responses/common.yaml。

register:
  post:
    operationId: auth_register
    summary: 注册
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/RegisterRequest' }
    responses:
      '200':
        description: 注册成功
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '../components/schemas/common.yaml#/WriteResult' }
                - type: object
                  properties:
                    user_id: { type: string }
                    account: { type: string }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '409': { $ref: '../components/responses/common.yaml#/Conflict' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

login:
  post:
    operationId: auth_login
    summary: 登录
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/LoginRequest' }
    responses:
      '200':
        description: 登录成功
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '../components/schemas/common.yaml#/SuccessEnvelope' }
                - type: object
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/AuthTokenResponse' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

otp_verify:
  post:
    operationId: auth_otp_verify
    summary: OTP 验证
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/OtpVerifyRequest' }
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

otp_resend:
  post:
    operationId: auth_otp_resend
    summary: OTP 重发
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/OtpResendRequest' }
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '429': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

mfa_verify:
  post:
    operationId: auth_mfa_verify
    summary: MFA challenge
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/MfaVerifyRequest' }
    responses:
      '200':
        description: MFA 验证成功
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '../components/schemas/common.yaml#/SuccessEnvelope' }
                - type: object
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/AuthTokenResponse' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

refresh:
  post:
    operationId: auth_refresh
    summary: 刷新 session
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/RefreshRequest' }
    responses:
      '200':
        description: 刷新成功（refresh rotation）
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '../components/schemas/common.yaml#/SuccessEnvelope' }
                - type: object
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/AuthTokenResponse' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

logout:
  post:
    operationId: auth_logout
    summary: 当前 session 退出
    tags: [Auth]
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

recovery:
  post:
    operationId: auth_recovery
    summary: 发起找回
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/RecoveryRequest' }
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

password_reset:
  post:
    operationId: auth_password_reset
    summary: 重置密码
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/PasswordResetRequest' }
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

me_sessions:
  get:
    operationId: auth_me_sessions
    summary: 已登录会话/设备
    tags: [Auth]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 会话列表
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '../components/schemas/common.yaml#/SuccessEnvelope' }
                - type: object
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/SessionListResponse' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

me_session_revoke:
  post:
    operationId: auth_me_session_revoke
    summary: 撤销其他 session
    tags: [Auth]
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/headers/request.yaml#/Idempotency-Key'
      - $ref: '../components/headers/request.yaml#/If-Match'
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '409': { $ref: '../components/responses/common.yaml#/Conflict' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }
