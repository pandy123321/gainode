      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }
  post:
    operationId: robot_upgrade_order_create
    summary: 创建升级订单（升级成本/资金去向 TBC → fail-closed）
    tags: [Robot]
    security: [{ bearerAuth: [] }]
