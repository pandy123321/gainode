# AI / Robot P0 路径骨架（05 §6 AI/Robot）
# 业务 request/response schema 在 S02-P02/P04 落地。
# S02-P04：56 级规则/预算/系数/Power/升级成本未 Active → 真实写操作 closed。
#   - 只读 GET 补 503（DEPENDENCY_UNAVAILABLE，无 Active Release 时 unavailable reason）。
#   - 写 POST（upgrade-orders / reward-claims / actions）补 503（fail-closed）。

user_summary:
  get:
    operationId: robot_user_summary
    summary: 用户 AI 汇总
    tags: [Robot]
    security: [{ bearerAuth: [] }]
    responses:
      '200': { $ref: '../components/responses/common.yaml#/Success' }
      '401': { $ref: '../components/responses/common.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses/common.yaml#/Forbidden' }
      '503': { $ref: '../components/responses/common.yaml#/DependencyUnavailable' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

