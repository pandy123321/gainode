; Webman / Workerman 运行配置
[PHP]
date.timezone = Asia/Shanghai
short_open_tag = Off
display_errors = Off
log_errors = On
error_log = /var/www/runtime/logs/php_error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 内存与执行时长（常驻进程建议关注内存）
memory_limit = 512M
max_execution_time = 0
max_input_time = 0
post_max_size = 50M
upload_max_filesize = 50M

; OPcache（CLI 常驻进程收益有限，可按需开启）
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=0

; 会话
session.save_path = /var/www/runtime/cache
